name: miniflux-mcp

on:
  push:
    branches: [main]
    paths:
      - miniflux-mcp/**
      - .github/workflows/miniflux-mcp.yaml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Read upstream version from the Dockerfile
        id: v
        run: echo "version=$(sed -n 's/^ARG VERSION=v\?//p' miniflux-mcp/Dockerfile | head -1)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: miniflux-mcp
          push: true
          tags: |
            ghcr.io/dapperdivers/miniflux-mcp:${{ steps.v.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
