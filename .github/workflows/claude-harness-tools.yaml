name: claude-harness-tools

on:
  push:
    branches: [master]
    paths:
      - claude-harness-tools/**
      - .github/workflows/claude-harness-tools.yaml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Read the kagent version and revision from the Dockerfile
        id: v
        run: |
          version="$(sed -n 's/^ARG KAGENT_VERSION=//p' claude-harness-tools/Dockerfile | head -1)"
          revision="$(sed -n 's/^ARG REVISION=//p' claude-harness-tools/Dockerfile | head -1)"
          echo "tag=${version}-r${revision}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: claude-harness-tools
          push: true
          tags: |
            ghcr.io/dapperdivers/claude-harness-tools:${{ steps.v.outputs.tag }}
