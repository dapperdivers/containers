name: arsenal-skills

on:
  push:
    branches: [main]
    paths:
      - arsenal-skills/**
      - .github/workflows/arsenal-skills.yaml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Read the arsenal commit from the Dockerfile
        id: v
        run: echo "tag=$(sed -n 's/^ARG ARSENAL_COMMIT=//p' arsenal-skills/Dockerfile | head -1 | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: arsenal-skills
          push: true
          tags: |
            ghcr.io/dapperdivers/arsenal-skills:${{ steps.v.outputs.tag }}
